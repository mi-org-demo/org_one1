cat > web/index.html << 'EOF'
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suma Interactiva</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 24px;
      color: #58a6ff;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #58a6ff;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #238636;
      border: 1px solid #2ea043;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:hover { background: #2ea043; }
    .resultado {
      text-align: center;
      padding: 12px;
      background: #0d1117;
      border-radius: 8px;
      font-size: 18px;
      color: #3fb950;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧮 Suma Interactiva</h1>
    <input type="number" id="num1" placeholder="Primer número" value="5">
    <input type="number" id="num2" placeholder="Segundo número" value="2">
    <button id="btn-calcular">Calcular Suma 🔢</button>
    <div class="resultado" id="resultado">Resultado: --</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.getElementById('btn-calcular');
      const num1 = document.getElementById('num1');
      const num2 = document.getElementById('num2');
      const resultado = document.getElementById('resultado');

      btn.addEventListener('click', function () {
        const a = Number(num1.value);
        const b = Number(num2.value);
        const suma = a + b;
        resultado.textContent = `Resultado: ${suma}`;
      });
    });
  </script>
</body>
</html>
EOF
